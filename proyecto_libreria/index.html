<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"defer></script>
    <title>Proyecto Libreria</title>
</head>
<body>
    <div><button class="btn-libro">Nuevo Libro</button></div>
    <dialog id="modal-libro">
        <form novalidate method="dialog">
            <div>
                <label for="titulo">Title</label>
                <input type="text" id="titulo" required>
                <span id="error-titulo" class="error-message"></span>
            </div>
            <div> 
                <label for="author">Author</label>
                <input type="text" id="author" required>
                <span id="error-autor" class="error-message"></span>
            </div>
            <div>
                <label for="pages">Pages</label>
                <input type="number" id="pages">
                <span id="error-paginas" class="error-message"></span>
            </div>
            <div> 
                <label for="read">Read</label>
                <input type="checkbox" id="read">
            </div>
            <div>
                <button type="submit">Guardar Libro</button>
            </div>
        </form>
    </dialog>
    <div class="contenedor-biblioteca"></div>
</body>
</html>
